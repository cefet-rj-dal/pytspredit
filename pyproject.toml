[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytspredit"
version = "0.11.1"
description = "Time series prediction with tunable preprocessing (Python port of the R tspredit framework)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Contributors to the pytspredit (Python) port. Roles follow the R Authors@R convention:
# cre (maintainer) -> maintainers; aut (author) + ths (advisor) and ctb (contributor)
# -> authors (PEP 621 has no separate contributor field); cph (copyright holder) ->
# CEFET/RJ, noted below. ORCID of the maintainer: 0000-0002-0466-0626.
maintainers = [
  { name = "Eduardo Ogasawara", email = "eogasawara@ieee.org" },
]
authors = [
  { name = "Eduardo Ogasawara", email = "eogasawara@ieee.org" },       # aut, ths, cre
  { name = "Diego Carvalho", email = "diego.carvalho@cefet-rj.br" },    # ctb
  { name = "Eduardo Bezerra", email = "ebezerra@cefet-rj.br" },         # ctb
  { name = "Esther Pacitti", email = "Esther.Pacitti@lirmm.fr" },       # ctb
  { name = "Fabio Porto", email = "fporto@lncc.br" },                   # ctb
  { name = "Fernando Alexandrino", email = "fernando.alexandrino@ifsp.edu.br" },  # aut
  { name = "Rebecca Salles", email = "rebecca.pontes-salles@inria.fr" },  # aut
  { name = "CEFET/RJ" },                                                # cph (copyright holder)
]
keywords = ["time series", "forecasting", "machine learning", "experiment line", "scikit-learn"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "matplotlib>=3.6",
  "pydaltoolbox>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1", "build", "twine"]
docs = ["jupytext>=1.16", "nbconvert>=7", "nbclient>=0.9", "ipykernel>=6"]

[project.urls]
Homepage = "https://github.com/cefet-rj-dal/pytspredit"
Repository = "https://github.com/cefet-rj-dal/pytspredit"
"Bug Tracker" = "https://github.com/cefet-rj-dal/pytspredit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pytspredit"]

# The published source distribution ships only the package and essential metadata.
# Development-only material (develop/, notebooks/, examples/, tests/) is kept
# out of what users install.
[tool.hatch.build.targets.sdist]
include = ["src/pytspredit", "README.md", "LICENSE"]
exclude = ["develop", "notebooks", "examples", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
